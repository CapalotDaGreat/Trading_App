name: Create development builds

jobs:
  android_development_build:
    name: Build Android Dev Client
    type: build
    params:
      platform: android
      profile: development
  ios_device_development_build:
    name: Build iOS device Dev Client
    type: build
    params:
      platform: ios
      profile: development
  ios_simulator_development_build:
    name: Build iOS simulator Dev Client
    type: build
    params:
      platform: ios
      profile: development-simulator
