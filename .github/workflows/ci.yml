name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Official major tags are retained until their commit SHAs are verified from the action refs.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Official major tag retained under the same verified-SHA policy above.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run expo:config
      - run: npm test -- --runInBand
      - run: npm run functions:build
      - run: npm run functions:test
      - run: npm run test:rules
      - run: git diff --check
      # Bundle export proves all platforms resolve; signed Maestro/tablet evidence stays a device gate.
      - run: npx expo export --platform all --output-dir .expo-export-ci
        env:
          EXPO_NO_TELEMETRY: 1
